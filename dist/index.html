<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка клиента: генератор и конвертер</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --line: #dfe3e8; --text: #1c2430; --muted: #6b7684;
  --accent: #2456c9; --good: #1a7f4b; --bad: #c0392b; --warn: #a15c00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1 { font-size: 17px; margin: 0; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0 0 6px; }
button, input, select { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; border-color: var(--line); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=text], input[type=number], select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--panel); min-width: 0; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad-text { color: var(--bad); } .warn-text { color: var(--warn); }
.spacer { flex: 1; }

.top { display: flex; align-items: center; gap: 24px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.top nav { display: flex; gap: 4px; }
.tab { border: none; background: none; padding: 8px 12px; border-radius: 6px; color: var(--muted); }
.tab.active { background: #e8eefb; color: var(--accent); font-weight: 600; }
main { padding: 16px 20px 40px; }
.tab-body { display: flex; flex-direction: column; gap: 12px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.panel > summary { cursor: pointer; color: var(--muted); }
.form { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; }
details .form { margin-top: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.form label.check, label.check { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); display: flex; }
.actions { display: flex; gap: 8px; }
.note { margin: 0; max-width: 900px; }

.drop { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed #b9c2cf; border-radius: 8px; background: var(--panel); }
.drop.over { border-color: var(--accent); background: #eef3fd; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.summary:empty { display: none; }
.issues ul, .issue-list { margin: 0; padding-left: 18px; }
.issue-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li.error { color: var(--bad); }

.split { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 12px; align-items: start; }
.client-list { display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 150px); overflow: auto; position: sticky; top: 64px; }
.client-list:empty, .detail:empty { display: none; }
.filters, .subtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.client { display: flex; align-items: center; gap: 8px; text-align: left; padding: 7px 10px; }
.client.active { border-color: var(--accent); background: #eef3fd; }
.client-title { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.client-title, .client-title small { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.client-title small { color: var(--muted); font-size: 11px; }
.mark { font-weight: 700; width: 14px; }
.badge { background: #fff1d6; color: var(--warn); border-radius: 999px; padding: 0 7px; font-size: 12px; }

.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; line-height: 19px; background: #eceff3; color: #445; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.chip.csv { background: #e6f1ea; color: #1d6a41; }
.chip.rule { background: #e8eefb; color: #2a4fa8; }
.chip.settings { background: #efe9fb; color: #5b3aa8; }
.chip.default { background: #fff1d6; color: var(--warn); }
.chip.bad { background: #fde8e6; color: var(--bad); }
.chip.ok { background: #e6f1ea; color: var(--good); }

.tree { margin-top: 8px; font-size: 13px; }
.group { border-left: 2px solid var(--line); margin: 2px 0 2px 4px; padding-left: 10px; }
.group > summary { cursor: pointer; padding: 3px 0; }
.group-body { padding-left: 6px; }
.leaf { display: grid; grid-template-columns: minmax(180px, 2fr) minmax(120px, 2fr) minmax(110px, 1.2fr) minmax(90px, 1fr); gap: 10px; padding: 3px 0 3px 16px; border-bottom: 1px solid #f0f2f5; align-items: baseline; }
.leaf.empty, .group.empty > summary { opacity: .55; }
.el-title { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
summary.el-title { display: list-item; }
summary.el-title > * { margin-right: 6px; }
.el-name { font-weight: 600; white-space: nowrap; }
.el-card { color: var(--muted); font: 11px var(--mono); }
.el-doc { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.el-value { overflow-wrap: anywhere; }
.el-type { font: 11px var(--mono); overflow-wrap: anywhere; }

.xml { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
.x-tag { color: #2a4fa8; } .x-comment { color: var(--warn); }

.table-scroll { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.grid { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
.grid th, .grid td { border-bottom: 1px solid #eef0f3; border-right: 1px solid #eef0f3; padding: 4px 8px; text-align: left; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.grid th { position: sticky; top: 0; background: #f1f3f6; }
.fatal { margin: 20px; color: var(--bad); white-space: pre-wrap; }

@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; }
  .client-list { position: static; max-height: 240px; }
  .leaf { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<!-- уровень 0: core -->
<script>/* src/core/ns.js */
/* Пространство имён приложения. Подключается первым.
   Каждый файл src/ — обычный скрипт: (function (C) { ... })(globalThis.Comita).
   Так код работает и по двойному щелчку (file://), и в Node (см. node-loader.js).

   Слои (ссылаться можно только на слои ниже):
     ui → services → mapping, generator → model → core */
(function (root) {
  'use strict';
  root.Comita = root.Comita || {
    core: {},                                   // уровень 0: чистые функции без предметной области
    schemas: {},                                // XSD как строки (генерирует build.js)
    model: { input: {}, output: {}, dict: {} }, // уровень 1: описания структур и справочники
    mapping: {},                                // уровень 2: правила csv → xml
    generator: {},                              // уровень 2: правила генерации csv
    services: {},                               // уровень 3: сценарии
    ui: {},                                     // уровень 4: DOM
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>
<script>/* src/core/csv.js */
/* CSV: разбор и запись. Формат выгрузки: UTF-8 с BOM, разделитель «;», CRLF, кавычки по RFC 4180. */
(function (C) {
  'use strict';

  /** Текст → массив строк, каждая строка — массив значений. */
  function parse(text, { delimiter = ';' } = {}) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let row = [], field = '', quoted = false, i = 0;
    const endField = () => { row.push(field); field = ''; };
    const endRow = () => { endField(); rows.push(row); row = []; };
    while (i < text.length) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i += 2; continue; }
        if (ch === '"') { quoted = false; i++; continue; }
        field += ch; i++; continue;
      }
      if (ch === '"' && field === '') { quoted = true; i++; continue; }
      if (ch === delimiter) { endField(); i++; continue; }
      if (ch === '\r' && text[i + 1] === '\n') { endRow(); i += 2; continue; }
      if (ch === '\n' || ch === '\r') { endRow(); i++; continue; }
      field += ch; i++;
    }
    if (field !== '' || row.length) endRow();
    return rows;
  }

  /** Массив строк → текст. */
  function stringify(rows, { delimiter = ';', eol = '\r\n', bom = true } = {}) {
    const needQuotes = new RegExp(`["\\r\\n${delimiter}]`);
    const cell = v => {
      const s = v == null ? '' : String(v);
      return needQuotes.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return (bom ? '﻿' : '') + rows.map(r => r.map(cell).join(delimiter)).join(eol) + eol;
  }

  C.core.csv = { parse, stringify };
})(globalThis.Comita);
</script>
<script>/* src/core/xml.js */
/* XML: разбор в дерево и запись дерева в текст.
   Узел: { tag, attrs: {}, children: [], text: '', line, comment? }
   comment — текст XML-комментария, который при записи ставится перед элементом. */
(function (C) {
  'use strict';

  const ENT = { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" };
  const decode = s => s.replace(/&(#x[0-9a-f]+|#\d+|\w+);/gi, (m, e) => {
    if (e[0] === '#') return String.fromCodePoint(e[1].toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : +e.slice(1));
    if (e in ENT) return ENT[e];
    throw new Error(`XML: неизвестная сущность ${m}`);
  });
  const escapeText = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escapeAttr = s => escapeText(s).replace(/"/g, '&quot;');

  const OPEN_TAG = /<([^\s\/>]+)((?:\s+[^\s=\/>]+\s*=\s*(?:"[^"]*"|'[^']*'))*)\s*(\/?)>/y;

  /** Текст → корневой узел. Комментарии и инструкции обработки пропускаются. */
  function parse(src) {
    let pos = 0, line = 1, counted = 0;
    const lineAt = p => { for (; counted < p; counted++) if (src.charCodeAt(counted) === 10) line++; return line; };
    const fail = msg => { throw new Error(`XML, строка ${lineAt(pos)}: ${msg}`); };
    const skipUntil = (end, what) => {
      const i = src.indexOf(end, pos);
      if (i < 0) fail(`не закрыт ${what}`);
      pos = i + end.length;
    };
    const stack = [];
    let root = null;
    const addText = t => {
      if (stack.length) stack[stack.length - 1].text += t;
      else if (t.trim()) fail('текст вне корневого элемента');
    };
    if (src.charCodeAt(0) === 0xFEFF) pos = 1;
    while (pos < src.length) {
      const lt = src.indexOf('<', pos);
      if (lt < 0) { addText(decode(src.slice(pos))); break; }
      if (lt > pos) addText(decode(src.slice(pos, lt)));
      pos = lt;
      if (src.startsWith('<!--', pos)) { skipUntil('-->', 'комментарий'); continue; }
      if (src.startsWith('<?', pos)) { skipUntil('?>', 'инструкция обработки'); continue; }
      if (src.startsWith('<![CDATA[', pos)) {
        const end = src.indexOf(']]>', pos);
        if (end < 0) fail('не закрыт CDATA');
        addText(src.slice(pos + 9, end)); pos = end + 3; continue;
      }
      if (src.startsWith('<!', pos)) { skipUntil('>', 'DOCTYPE'); continue; }
      if (src[pos + 1] === '/') {
        const end = src.indexOf('>', pos);
        if (end < 0) fail('не закрыт тег');
        const name = src.slice(pos + 2, end).trim();
        const open = stack.pop();
        if (!open || open.tag !== name) fail(`закрывающий тег </${name}> не соответствует <${open ? open.tag : '?'}>`);
        pos = end + 1; continue;
      }
      OPEN_TAG.lastIndex = pos;
      const m = OPEN_TAG.exec(src);
      if (!m) fail('некорректный тег');
      const node = { tag: m[1], attrs: {}, children: [], text: '', line: lineAt(pos) };
      for (const a of m[2].matchAll(/([^\s=]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)) node.attrs[a[1]] = decode(a[2] ?? a[3]);
      if (stack.length) stack[stack.length - 1].children.push(node);
      else if (root) fail('несколько корневых элементов');
      else root = node;
      if (!m[3]) stack.push(node);
      pos += m[0].length;
    }
    if (stack.length) fail(`не закрыт элемент <${stack[stack.length - 1].tag}>`);
    if (!root) fail('нет корневого элемента');
    return root;
  }

  /** Дерево → текст с отступами. */
  function serialize(root, { indent = '  ', declaration = true } = {}) {
    const out = declaration ? ['<?xml version="1.0" encoding="UTF-8"?>'] : [];
    (function write(n, pad) {
      if (n.comment) out.push(`${pad}<!-- ${String(n.comment).replace(/--/g, '—')} -->`);
      const attrs = Object.entries(n.attrs || {}).map(([k, v]) => ` ${k}="${escapeAttr(v)}"`).join('');
      const kids = n.children || [];
      if (kids.length) {
        out.push(`${pad}<${n.tag}${attrs}>`);
        kids.forEach(k => write(k, pad + indent));
        out.push(`${pad}</${n.tag}>`);
      } else if (n.text != null && n.text !== '') out.push(`${pad}<${n.tag}${attrs}>${escapeText(n.text)}</${n.tag}>`);
      else out.push(`${pad}<${n.tag}${attrs}/>`);
    })(root, '');
    return out.join('\n') + '\n';
  }

  C.core.xml = { parse, serialize, escapeText };
})(globalThis.Comita);
</script>
<script>/* src/core/xsd-model.js */
/* XSD → модель схемы. Единственный источник структуры выходного XML:
   её используют построитель XML, валидатор, дерево «Структура» в UI и (этап 2) диаграммы.

   Поддерживается подмножество XSD 1.0, которого достаточно для «Карточки клиента»:
   include, element, complexType (sequence/choice), simpleType (restriction от xs:string:
   pattern, enumeration, length, minLength, maxLength), minOccurs/maxOccurs, annotation.
   Любая другая конструкция даёт явную ошибку, а не молчаливый пропуск.

   Объявление элемента (ElementDecl):
     { name, path, min, max, doc, inChoice,
       simple:  null | { name, steps: [{ patterns, enums, length, minLength, maxLength }] },
       content: null | Particle,           // модель содержимого для валидатора
       children: [ElementDecl] }           // те же элементы плоским списком в порядке схемы
   Particle: { kind: 'element', decl } | { kind: 'sequence'|'choice', min, max, items: [Particle] } */
(function (C) {
  'use strict';
  const { xml } = C.core;

  const local = t => t.replace(/^[^:]*:/, '');
  const occurs = (n, k) => (n.attrs[k] === undefined ? 1 : n.attrs[k] === 'unbounded' ? Infinity : +n.attrs[k]);
  const unsupported = (what, n) => { throw new Error(`XSD, строка ${n.line}: конструкция «${what}» не поддерживается`); };
  const kids = (n, ...names) => n.children.filter(c => names.includes(local(c.tag)));
  const docOf = n => kids(n, 'annotation').flatMap(a => kids(a, 'documentation')).map(d => d.text.trim()).join(' ');

  /**
   * @param {string} xsdText  текст главной схемы
   * @param {{includes?: Object<string,string>}} [opt]  тексты схем для xs:include по имени файла
   */
  function build(xsdText, opt = {}) {
    const top = [];
    (function load(text) {
      const doc = xml.parse(text);
      if (local(doc.tag) !== 'schema') throw new Error('XSD: корневой элемент должен быть xs:schema');
      for (const c of doc.children) {
        if (local(c.tag) !== 'include') { top.push(c); continue; }
        const inc = (opt.includes || {})[c.attrs.schemaLocation];
        if (inc == null) throw new Error(`XSD: не передана включаемая схема «${c.attrs.schemaLocation}»`);
        load(inc);
      }
    })(xsdText);

    const simpleSrc = {}, complexSrc = {}, simpleCache = {};
    let rootSrc = null;
    for (const c of top) {
      const k = local(c.tag);
      if (k === 'simpleType') simpleSrc[c.attrs.name] = c;
      else if (k === 'complexType') complexSrc[c.attrs.name] = c;
      else if (k === 'element') { if (rootSrc) unsupported('несколько корневых элементов', c); rootSrc = c; }
      else if (k !== 'annotation') unsupported(c.tag, c);
    }
    if (!rootSrc) throw new Error('XSD: не найден корневой элемент');

    // ---------- простые типы ----------
    function simpleType(node, name) {
      const r = kids(node, 'restriction')[0];
      if (!r) unsupported('simpleType без restriction', node);
      const step = { patterns: [], enums: [] };
      for (const f of r.children) {
        const k = local(f.tag), v = f.attrs.value;
        if (k === 'pattern') step.patterns.push(v);
        else if (k === 'enumeration') step.enums.push(v);
        else if (k === 'length' || k === 'minLength' || k === 'maxLength') step[k] = +v;
        else if (k === 'simpleType' || k === 'annotation') continue;
        else unsupported(f.tag, f);
      }
      const inner = kids(r, 'simpleType')[0];
      const base = inner ? simpleType(inner, null) : namedSimple(r.attrs.base, r);
      return { name: name || base.name, steps: [...base.steps, step] };
    }
    function namedSimple(typeName, at) {
      const n = local(typeName);
      if (simpleSrc[n]) return simpleCache[n] || (simpleCache[n] = simpleType(simpleSrc[n], n));
      if (/^xsd?:string$/.test(typeName)) return { name: 'string', steps: [] };
      return unsupported(`тип ${typeName}`, at);
    }

    // ---------- элементы и сложные типы ----------
    function element(node, parentPath, inChoice) {
      const name = node.attrs.name;
      if (!name) unsupported('element без name (ref)', node);
      const decl = {
        name, path: parentPath ? `${parentPath}/${name}` : name,
        min: occurs(node, 'minOccurs'), max: occurs(node, 'maxOccurs'),
        doc: docOf(node), inChoice, simple: null, content: null, children: [],
      };
      const inlineComplex = kids(node, 'complexType')[0], inlineSimple = kids(node, 'simpleType')[0];
      const typeName = node.attrs.type && local(node.attrs.type);
      const complex = inlineComplex || (typeName && complexSrc[typeName]);
      if (complex) {
        decl.typeName = typeName || null;
        if (!decl.doc) decl.doc = docOf(complex);
        const groups = kids(complex, 'sequence', 'choice');
        for (const c of complex.children) if (!['sequence', 'choice', 'annotation'].includes(local(c.tag))) unsupported(c.tag, c);
        if (groups.length > 1) unsupported('несколько групп в complexType', complex);
        if (groups.length) decl.content = particle(groups[0], decl, false);
      } else {
        decl.simple = inlineSimple ? simpleType(inlineSimple, null) : namedSimple(node.attrs.type || 'xs:string', node);
      }
      return decl;
    }
    function particle(node, owner, inChoice) {
      const kind = local(node.tag);
      const p = { kind, min: occurs(node, 'minOccurs'), max: occurs(node, 'maxOccurs'), items: [] };
      for (const c of node.children) {
        const k = local(c.tag);
        if (k === 'element') {
          const decl = element(c, owner.path, inChoice || kind === 'choice');
          owner.children.push(decl);
          p.items.push({ kind: 'element', decl });
        } else if (k === 'sequence' || k === 'choice') p.items.push(particle(c, owner, inChoice || kind === 'choice'));
        else if (k !== 'annotation') unsupported(c.tag, c);
      }
      return p;
    }

    const root = element(rootSrc, '', false);
    const index = new Map();
    (function walk(d) { index.set(d.path, d); d.children.forEach(walk); })(root);
    return {
      root,
      /** Объявление элемента по пути «СведКлиент/ИнфКлиент/…» или undefined. */
      find: path => index.get(path),
      paths: () => [...index.keys()],
    };
  }

  // ---------- проверка значения простого типа ----------
  const patternCache = new Map();
  const patternRe = p => patternCache.get(p) || patternCache.set(p, new RegExp(`^(?:${p})$`)).get(p);

  /** Возвращает список нарушений: [{ facet, message }]. Пустой список — значение допустимо. */
  function checkSimple(simple, value) {
    const problems = [], len = [...value].length;
    for (const s of simple.steps) {
      if (s.length !== undefined && len !== s.length) problems.push({ facet: 'length', limit: s.length, message: `длина ${len}, требуется ровно ${s.length}` });
      if (s.minLength !== undefined && len < s.minLength) problems.push({ facet: 'minLength', limit: s.minLength, message: `длина ${len} меньше минимальной ${s.minLength}` });
      if (s.maxLength !== undefined && len > s.maxLength) problems.push({ facet: 'maxLength', limit: s.maxLength, message: `длина ${len} больше максимальной ${s.maxLength}` });
      if (s.patterns.length && !s.patterns.some(p => patternRe(p).test(value))) problems.push({ facet: 'pattern', message: `не соответствует шаблону «${s.patterns.join('» | «')}»` });
      if (s.enums.length && !s.enums.includes(value)) problems.push({ facet: 'enumeration', message: `нет среди допустимых значений (${s.enums.join(', ')})` });
    }

<script>/* src/model/input/dsl.js */
/* Описание входной структуры (csv). Колонки задаются по порядку: заголовки в выгрузке
   обрезаны и повторяются, поэтому колонку определяет её позиция, а не имя.

     section('ben', '->Сведения о бенефициарных владель')   служебная колонка-маркер секции
     col('lastName', 'Фамилия')                             алиас поля = «секция.имя» → ben.lastName
     col('main.pep', '…')                                   алиас с точкой задаётся целиком

   define() превращает список в структуру { type, title, columns: [{ index, alias, header, marker }] }. */
(function (C) {
  'use strict';

  const section = (alias, header) => ({ section: alias, header });
  const col = (alias, header) => ({ alias, header });

  function define(type, title, items) {
    const columns = [];
    let current = '';
    for (const it of items) {
      if (it.section) {
        current = it.section;
        columns.push({ index: columns.length, alias: `${current}.$marker`, header: it.header, marker: true });
      } else {
        const alias = it.alias.includes('.') ? it.alias : `${current}.${it.alias}`;
        columns.push({ index: columns.length, alias, header: it.header, marker: false });
      }
    }
    const seen = new Set();
    for (const c of columns) {
      if (seen.has(c.alias)) throw new Error(`Входная структура ${type}: алиас «${c.alias}» повторяется`);
      seen.add(c.alias);
    }
    return { type, title, columns, aliases: seen };
  }

  C.model.input.dsl = { section, col, define };
})(globalThis.Comita);
</script>

    // ---- СведенияФЛИП ----
    'flName.last':             '@flName/Фам',

    'fl.snils':                '@fl/СНИЛСФЛИП',
    'fl.okved2':               '@fl/ОКВЭД2ИП',
  };

  const expand = p => p.replace(/^@([^/]+)/, (m, a) => {
    if (!(a in objects)) throw new Error(`Выходная структура: неизвестный объект «${a}»`);
    return expand(objects[a]);
  });

  /**
   * Сверяет алиасы со схемой и возвращает функцию «алиас → путь в XML».
   * Алиас вида «объект.*» означает объект целиком и возвращает путь объекта.
   */
  function resolve(model) {
    const paths = new Map();
    for (const [alias, p] of Object.entries(objects)) paths.set(`${alias}.*`, expand(p));
    for (const [alias, p] of Object.entries(fields)) paths.set(alias, expand(p));
    for (const [alias, p] of paths) {
      if (!model.find(p)) throw new Error(`Выходная структура: алиас «${alias}» указывает на путь «${p}», которого нет в XSD`);
    }
    return alias => {
      if (!paths.has(alias)) throw new Error(`Выходная структура: неизвестный алиас «${alias}»`);
      return paths.get(alias);
    };
  }

  C.model.output.clientinfo = { objects, fields, resolve };

<script>/* src/mapping/dsl.js */
/* Язык описания маппинга. Одно правило — одна строка:

     map('fl.inn',  src('main.inn'),  t.inn(12))
          │          │                 └─ преобразование (необязательно): (значение, ctx) → значение
          │          └─ источник
          └─ алиас поля выходной структуры (model/output); «объект.*» — объект целиком

   Источники:
     src('a')            колонка csv по алиасу входной структуры
     src('a', 'b')       первое непустое из нескольких колонок
     konst('2')          постоянное значение (правило системы, а не умолчание)
     opt('employee.x')   настройка конвертера, заданная пользователем
     parts([...])        несколько колонок с подписями (для поля «Иная информация»)

   Прочие правила:
     required('flDoc.number', 'текст')   поле обязано получить значение, иначе ошибка входных данных
     def('client.active', '1', 'причина') значение по умолчанию для поля без источника (mapping/defaults.js)

   Правила применяются сверху вниз; если поле уже заполнено, следующее правило для него пропускается. */
(function (C) {
  'use strict';

  const map = (target, source, transform) => ({ rule: 'map', target, source, transform });
  const required = (target, message) => ({ rule: 'required', target, message });
  const def = (target, value, reason, only) => ({ rule: 'default', target, value, reason, only });

  const src = (...aliases) => ({ kind: 'src', aliases });
  const konst = value => ({ kind: 'const', value });
  const opt = name => ({ kind: 'opt', name });
  const parts = list => ({ kind: 'parts', list });

  C.mapping.dsl = { map, required, def, src, konst, opt, parts };
})(globalThis.Comita);
</script>
<script>/* src/mapping/transforms.js */
/* Преобразования значений для маппинга. Каждое — чистая функция (значение, ctx) → результат:
     строка            значение элемента
     массив строк      повторяющийся элемент
     объект            значения дочерних элементов (для правил «объект.*»)
     undefined         элемент не выводится
   ctx.warn(текст) добавляет предупреждение, ctx.asDefault(причина) помечает значение как умолчание. */
(function (C) {
  'use strict';
  const D = C.model.dict;
  const sums = C.core.checksums;

  const clean = v => String(v ?? '').trim();
  /** Число, испорченное пересохранением в Excel: 4,08E+19. */
  const isExcelDamaged = v => /^\d+([.,]\d+)?E\+?\d+$/i.test(clean(v));

  // ---------- даты ----------
  /** ДД.ММ.ГГГГ → ДД/ММ/ГГГГ (формат XSD). */
  function date(value, ctx) {
    const m = /^(\d{2})[./](\d{2})[./](\d{4})$/.exec(clean(value));
    if (!m) return ctx.warn(`дата «${value}» не в формате ДД.ММ.ГГГГ, не выведена`);
    const d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
    if (d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[1]) return ctx.warn(`дата «${value}» не существует, не выведена`);
    return `${m[1]}/${m[2]}/${m[3]}`;
  }

  // ---------- числовые реквизиты ----------
  /**
   * Реквизит фиксированной длины из цифр. Короткое значение дополняется ведущими нулями:
   * их теряет Excel при пересохранении файла. Контрольная сумма проверяется, но не блокирует вывод.
   */
  const requisite = (label, length, check) => (value, ctx) => {
    let v = clean(value).replace(/\s/g, '');
    if (isExcelDamaged(v)) return ctx.warn(`${label} «${value}» повреждён при пересохранении в Excel, не выведен`);
    if (!/^\d+$/.test(v)) return ctx.warn(`${label} «${value}» содержит не только цифры, не выведен`);
    if (v.length > length) return ctx.warn(`${label} «${value}»: ${v.length} цифр вместо ${length}, не выведен`);
    if (v.length < length) {
      ctx.warn(`${label} «${value}»: ${v.length} цифр вместо ${length}, восстановлены ведущие нули`);
      v = v.padStart(length, '0');
    }
    if (check && !check(v)) ctx.warn(`${label} «${v}»: неверная контрольная сумма`);
    return v;
  };
  const inn = length => requisite('ИНН', length, sums.checkInn);
  const ogrn = length => requisite(length === 15 ? 'ОГРНИП' : 'ОГРН', length, sums.checkOgrn);
  const kpp = requisite('КПП', 9);
  const bik = requisite('БИК', 9);
  const okpo = length => requisite('ОКПО', length, sums.checkOkpo);
  /** 11 цифр или маска → «ЦЦЦ-ЦЦЦ-ЦЦЦ ЦЦ». */
  function snils(value, ctx) {
    const d = requisite('СНИЛС', 11, sums.checkSnils)(clean(value).replace(/-/g, ''), ctx);
    return d && sums.formatSnils(d);
  }
  /** Один код или список кодов ОКВЭД через «|», «;» или «,». */
  function okved(value, ctx) {
    const codes = clean(value).split(/[|;,]/).map(clean).filter(Boolean);
    const ok = codes.filter(c => /^\d{2}(\.\d{1,2}){0,2}$/.test(c));
    if (ok.length < codes.length) ctx.warn(`ОКВЭД «${value}»: часть кодов не в формате ЦЦ.ЦЦ.ЦЦ, они не выведены`);
    return ok;
  }

  // ---------- справочники ----------
  function country(field) {
    return (value, ctx) => {
      const c = D.oksm[clean(value).toUpperCase()];
      if (!c) return ctx.warn(`гражданство «${value}» не найдено в справочнике ОКСМ`);
      return c[field] || undefined;
    };
  }
  const citizenshipKind = value => D.citizenshipKind[clean(value).toUpperCase()] || D.citizenshipKind['*'];

  /** В системе только паспорта РФ: код и наименование постоянны, колонка «Документ» лишь сверяется. */
  function passport(field) {
    return (value, ctx) => {
      if (clean(value) !== D.passport.sourceValue) ctx.warn(`вид документа «${value}» не «${D.passport.sourceValue}»: выведен код паспорта РФ`);
      return D.passport[field];
    };
  }

  function okopf(value, ctx) {
    const hit = D.okopf[clean(value).toLowerCase().replace(/ё/g, 'е')];
    if (!hit) return ctx.warn(`ОПФ «${value}» не найдена в справочнике ОКОПФ, код не выведен`);
    if (hit.warn) ctx.warn(`ОПФ «${value}»: ${hit.warn}`);
    return hit.code;
  }

  /** Статус ПДЛ → ПризнакПринПубЛицо. Государство ПДЛ в csv не выгружается, поэтому принимается «Россия». */
  function pepFlag(value, ctx) {
    const codes = D.pepStatus[clean(value)];
    if (!codes) return ctx.warn(`статус ПДЛ «${value}» не найден в справочнике, признак не выведен`);
    if (codes[0] !== '0') ctx.asDefault('государство ПДЛ в csv не выгружается, принято «Россия»');
    return codes[0];
  }

  /** Свободный текст «Степень родства» → код по ключевому слову. */
  function kinship(value, ctx) {
    const words = clean(value).toLowerCase().replace(/ё/g, 'е').split(/[^а-я]+/).filter(Boolean);
    const codes = [...new Set(words.map(w => D.kinship[w]).filter(Boolean))];
    if (codes.length === 1) return codes[0];
    return ctx.warn(`степень родства «${value}» не удалось однозначно перевести в код`);
  }

  /** Первые две цифры ОКАТО → КодСубъектаПоОКАТО. */
  const okatoRegion = value => (/^\d{2}/.exec(clean(value)) || [])[0];

  // ---------- адрес ----------
  /* Система склеивает адрес из полей формы в порядке:
       Индекс, Регион, Район, Населённый пункт, Улица, Дом, Строение, Корпус, Квартира
     Строка из 9 частей (или 8 — без Района) раскладывается обратно по позициям.
     Признаки, что строка действительно склеена так: первая часть — индекс, вторая — субъект РФ.
     Любая другая строка не разбирается: индекс (если есть) и остальной текст в «Пункт». */
  const SLOTS9 = ['zip', 'region', 'district', 'city', 'street', 'house', 'building', 'block', 'flat'];
  const SLOTS8 = SLOTS9.filter(s => s !== 'district');
  const RUSSIA = { КодОКСМ: '643', СтранаНаименование: 'Россия' };

  function address(value, ctx) {
    const text = clean(value);
    if (!text) return undefined;
    const list = text.split(',').map(clean);
    const slots = list.length === 9 ? SLOTS9 : list.length === 8 ? SLOTS8 : null;
    const regionCode = slots && /^\d{6}$/.test(list[0]) ? D.regions.codeByName(list[1]) : undefined;
    if (regionCode) {
      const a = Object.fromEntries(slots.map((s, i) => [s, list[i]]));
      if (list.length === 8) ctx.warn(`адрес «${text}» из 8 частей: считаем, что пропущен Район`);
      return {
        ...RUSSIA,
        Индекс: a.zip,
        КодСубъектаПоОКАТО: regionCode,
        Район: a.district,
        Пункт: a.city,
        Улица: a.street,
        Дом: a.house,
        Корп: [a.block, a.building && `стр. ${a.building}`].filter(Boolean).join(', '),
        Оф: a.flat,
      };
    }
    ctx.warn(`адрес «${text}» не в формате системы (9 частей, индекс, субъект РФ): записан в «Пункт» без разбора`);
    const zip = (/^(\d{6})\s*,/.exec(text) || [])[1];
    const rest = (zip ? text.slice(text.indexOf(',') + 1) : text).replace(/(\s*,)+\s*$/, '').trim();
    const found = [...new Set(list.map(D.regions.codeByName).filter(Boolean))];
    return {
      ...(found.length === 1 ? { ...RUSSIA, КодСубъектаПоОКАТО: found[0] } : {}),
      Индекс: zip,
      Пункт: rest,
    };
  }

  // ---------- «Иная информация» ----------
  /** Список { label, value } → «Подпись: значение; Подпись: значение». */
  function otherInfo(items, ctx) {
    const out = [];
    for (const { label, value } of items) {
      const v = clean(value).replace(/\s+/g, ' ');
      if (!v) continue;
      if (isExcelDamaged(v)) {
        ctx.warn(`«${label}»: значение «${v}» повреждено при пересохранении в Excel`);
        out.push(`${label}: ${v} (значение повреждено в Excel)`);
      } else out.push(`${label}: ${v}`);
    }
    return out.join('; ');
  }

  C.mapping.transforms = {
    date, inn, ogrn, kpp, bik, okpo, snils, okved,
    country, citizenshipKind, passport, okopf, pepFlag, kinship, okatoRegion,
    address, otherInfo,
  };
})(globalThis.Comita);
</script>
<script>/* src/mapping/engine.js */
/* Движок маппинга: строка csv + правила → значения полей выходной структуры.
   Результат — Map «путь в XML → запись»:
     { value: строка | [строки], origin: 'csv' | 'rule' | 'settings' | 'default',
       source: 'main.inn', sourceLabel: 'ИНН', note, rejected }
   Сам XML здесь не строится — это делает mapping/builder.js по XSD-модели. */
(function (C) {
  'use strict';
  const { checkSimple } = C.core.xsdModel;

  const isEmpty = v => v == null || v === '' || (Array.isArray(v) && !v.length);
  const getOption = (options, name) => name.split('.').reduce((o, k) => (o == null ? o : o[k]), options);

  /**
   * @param row      { алиас колонки: значение }
   * @param spec     { type, input (входная структура), rules, defaults, model, pathOf }
   * @param options  настройки конвертера
   * @returns {{ values: Map, issues: [{ level, field, message }] }}
   */
  function apply(row, spec, options = {}) {
    const values = new Map();
    const issues = [];
    const headerOf = alias => (spec.input.columns.find(c => c.alias === alias) || {}).header || alias;

    /** Читает источник правила: { value, origin, source, sourceLabel }. */
    function read(source) {
      if (source.kind === 'const') return { value: source.value, origin: 'rule' };
      if (source.kind === 'opt') return { value: getOption(options, source.name), origin: 'settings', sourceLabel: 'настройки конвертера' };
      if (source.kind === 'parts') {
        const items = source.list.map(([label, aliases]) => ({ label, value: [].concat(aliases).map(a => row[a] || '').filter(Boolean).join(' ') }));
        return { value: items, origin: 'csv', sourceLabel: 'несколько колонок csv' };
      }
      const alias = source.aliases.find(a => !isEmpty(row[a])) || source.aliases[0];
      if (!spec.input.aliases.has(alias)) throw new Error(`Маппинг ${spec.type}: во входной структуре нет колонки «${alias}»`);
      return { value: row[alias], origin: 'csv', source: alias, sourceLabel: headerOf(alias).trim() };
    }

    function put(path, value, entry) {
      if (isEmpty(value) || values.has(path)) return;
      values.set(path, { ...entry, value });
    }

    for (const r of spec.rules) {
      const path = spec.pathOf(r.target);
      if (r.rule === 'required') {
        if (!values.has(path)) issues.push({ level: 'error', field: r.target, message: r.message });
        continue;
      }
      const input = read(r.source);
      if (isEmpty(input.value)) continue;
      const entry = { origin: input.origin, source: input.source, sourceLabel: input.sourceLabel };
      const ctx = {
        row, type: spec.type, options,
        warn: message => { issues.push({ level: 'warn', field: r.target, message }); },
        asDefault: note => { entry.origin = 'default'; entry.note = note; },
      };
      const result = r.transform ? r.transform(input.value, ctx) : input.value;
      if (r.target.endsWith('.*')) {
        for (const [tag, v] of Object.entries(result || {})) put(`${path}/${tag}`, v, entry);
      } else put(path, result, entry);
    }

    for (const d of spec.defaults) {
      if (d.only && !d.only.includes(spec.type)) continue;
      put(spec.pathOf(d.target), d.value, { origin: 'default', note: d.reason });
    }

    fitToSchema(values, spec.model, issues);
    return { values, issues };
  }

  /**
   * Приводит значения к ограничениям XSD: слишком длинный текст обрезается,
   * значение, которое всё равно не проходит по схеме, не выводится. В обоих случаях — предупреждение.
   */
  function fitToSchema(values, model, issues) {
    for (const [path, entry] of values) {
      const decl = model.find(path);
      if (!decl || !decl.simple) throw new Error(`Маппинг: «${path}» не является простым элементом схемы`);
      const name = decl.name;
      const fit = raw => {
        let v = String(raw).replace(/[\r\n]+/g, ' ').trim();
        const tooLong = checkSimple(decl.simple, v).find(p => p.facet === 'maxLength');
        if (tooLong) {
          issues.push({ level: 'warn', field: name, message: `${name}: текст длиннее ${tooLong.limit} символов, обрезан` });
          v = [...v].slice(0, tooLong.limit).join('').trim();
        }
        const problems = checkSimple(decl.simple, v);
        if (!problems.length) return v;
        issues.push({ level: 'warn', field: name, message: `${name}: значение «${v}» ${problems[0].message}, не выведено` });
        entry.rejected = v;
        return undefined;
      };
      const fitted = Array.isArray(entry.value) ? entry.value.map(fit).filter(v => v !== undefined) : fit(entry.value);
      entry.value = isEmpty(fitted) ? undefined : fitted;
    }
  }

  C.mapping.engine = { apply };
})(globalThis.Comita);
</script>
<script>/* src/mapping/builder.js */
/* Построитель: значения полей + XSD-модель → XML-дерево и дерево для просмотра.
   Порядок и состав элементов задаёт только схема, порядок правил маппинга на них не влияет.

   Правило вывода в XML: элемент выводится, если у него есть значение (или значения в поддереве)
   либо если его требует схема (minOccurs ≥ 1 внутри выводимого родителя). На экране «Структура»
   видны все элементы схемы, включая пустые. */
(function (C) {
  'use strict';
  const { describeSimple } = C.core.xsdModel;

  const card = d => `${d.min}..${d.max === Infinity ? '*' : d.max}`;

  /**
   * @returns {{ tree: узел XML, view: узел просмотра }}
   * Узел просмотра: { name, path, doc, card, type, leaf, value, entry, emitted, children }
   */
  function build(values, model) {
    const valuePaths = [...values].filter(([, e]) => e.value !== undefined).map(([p]) => p);
    const hasData = decl => valuePaths.some(p => p === decl.path || p.startsWith(decl.path + '/'));

    function element(decl, parentEmitted) {
      const view = { name: decl.name, path: decl.path, doc: decl.doc, card: card(decl), leaf: !!decl.simple, children: [] };
      if (decl.simple) {
        const entry = values.get(decl.path);
        const list = entry && entry.value !== undefined ? [].concat(entry.value) : [];
        Object.assign(view, { type: describeSimple(decl.simple), entry, value: list.join(' | '), emitted: list.length > 0 });
        const comment = entry && entry.origin === 'default' ? `значение по умолчанию: ${entry.note}` : undefined;
        return { view, nodes: list.map(text => ({ tag: decl.name, attrs: {}, children: [], text, comment })) };
      }
      const emitted = hasData(decl) || (parentEmitted && decl.min >= 1 && !decl.inChoice);
      const choiceMade = decl.children.some(c => c.inChoice && hasData(c));
      const node = { tag: decl.name, attrs: {}, children: [], text: '' };
      for (const child of decl.children) {
        if (child.inChoice && choiceMade && !hasData(child)) continue;   // невыбранная альтернатива xs:choice
        const built = element(child, emitted);
        view.children.push(built.view);
        node.children.push(...built.nodes);
      }
      view.emitted = emitted;
      return { view, nodes: emitted ? [node] : [] };
    }

    const { view, nodes } = element(model.root, true);
    return { tree: nodes[0], view };
  }

  C.mapping.builder = { build };
})(globalThis.Comita);
</script>

   регион адреса ↔ серия паспорта, код подразделения, ИНН; возраст ↔ дата выдачи паспорта;
   даты заявки ≤ идентификации ≤ регистрации. Контрольные суммы реквизитов верны. */
(function (C) {
  'use strict';
  const D = C.generator.data;
  const sums = C.core.checksums;
  const okatoOf = C.model.dict.regions.codeByName;

  const pad = (n, len = 2) => String(n).padStart(len, '0');
  const fmt = d => `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`;
  const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
  const addYears = (d, n) => new Date(Date.UTC(d.getUTCFullYear() + n, d.getUTCMonth(), d.getUTCDate()));
  const yy = d => pad(d.getUTCFullYear() % 100);
  const uuid = rnd => [8, 4, 4, 4, 12].map(n => rnd.hex(n)).join('-');
  const phone = rnd => '9' + rnd.digits(9);

  /** Адрес в формате системы: 9 частей через запятую, пустые части остаются пустыми. */
  function address(rnd, region = rnd.pick(D.regions)) {
    const rural = region.districts && rnd.chance(0.2);
    const a = {
      region,
      zip: region.zip + rnd.digits(3),
      regionName: region.name,
      district: rural ? rnd.pick(region.districts) : '',
      city: rural ? `село ${rnd.pick(['Ивановское', 'Покровское', 'Никольское', 'Троицкое'])}` : rnd.pick(region.cities),
      street: rnd.pick(D.streets),
      house: String(rnd.int(1, 150)) + (rnd.chance(0.1) ? rnd.pick(['А', 'Б', '/2']) : ''),
      building: rnd.chance(0.1) ? String(rnd.int(1, 5)) : '',
      block: rnd.chance(0.15) ? String(rnd.int(1, 9)) : '',
      flat: rnd.chance(0.85) ? String(rnd.int(1, 300)) : '',
    };
    a.text = [a.zip, a.regionName, a.district, a.city, a.street, a.house, a.building, a.block, a.flat].join(', ');
    return a;
  }

  /** Паспорт РФ: серия = код региона по ОКАТО + год бланка; выдан в 14, 20 или 45 лет. */
  function passport(rnd, birth, region, today) {
    const issued = [45, 20, 14].map(age => addDays(addYears(birth, age), rnd.int(5, 60))).find(d => d <= today)
      || addDays(addYears(birth, 14), 5);
    return {
      docType: C.model.dict.passport.sourceValue,
      docSeries: okatoOf(region.name) + yy(issued),
      docNumber: pad(rnd.int(1, 999999), 6),
      docIssueDate: fmt(issued),
      docDeptCode: `${region.tax}0-${pad(rnd.int(1, 99), 3)}`,
      docIssuer: `ГУ МВД России по ${region.where}`,
    };
  }

  /** Физическое лицо: совершеннолетний гражданин РФ с паспортом, ИНН и СНИЛС. */
  function person(rnd, { today }, minAge = 19) {
    const names = rnd.chance(0.5) ? D.male : D.female;
    const birth = addDays(addYears(today, -rnd.int(minAge, 75)), -rnd.int(0, 364));
    const home = address(rnd);
    const region = home.region;
    const p = {
      lastName: rnd.pick(names.last), firstName: rnd.pick(names.first), middleName: rnd.pick(names.middle),
      birthDate: fmt(birth),
      birthPlace: rnd.pick(rnd.pick(D.regions).cities),
      citizenship: 'RU',
      addrReg: home.text,
      addrLive: rnd.chance(0.8) ? home.text : address(rnd, region).text,
      ...passport(rnd, birth, region, today),
      inn: sums.makeInn12(region.tax + pad(rnd.int(1, 50)) + rnd.digits(6)),
      snils: sums.makeSnils(pad(rnd.int(2, 999), 3) + rnd.digits(6)),
      phone: phone(rnd),
      email: `${rnd.pick(D.logins)}${rnd.int(1, 999)}@example.com`,
      region, birth,
    };
    p.fullName = `${p.lastName} ${p.firstName} ${p.middleName}`;
    p.addrPost = p.addrLive;
    return p;
  }

  /** Расчётный счёт клиента в одном из банков. */
  function bank(rnd, type) {
    const b = rnd.pick(D.banks);
    return { ...b, account: sums.makeAccount(D.accountPrefix[type] + '0' + rnd.digits(11), b.bik) };
  }

  /** Наименование налогового органа региона. */
  const taxOffice = (rnd, region) => `Межрайонная инспекция Федеральной налоговой службы № ${rnd.int(1, 30)} по ${region.where}`;

  /** Сведения об индивидуальном предпринимателе (дополнение к person): регистрация ИП — после 18 лет. */
  function entrepreneur(rnd, who, { today }) {
    const adult = addYears(who.birth, 18), earliest = addYears(today, -15);
    const registered = rnd.date(adult > earliest ? adult : earliest, addDays(today, -400));
    return {
      ogrnip: sums.makeOgrn('3' + yy(registered) + who.region.tax + rnd.digits(9)),
      regDate: fmt(registered),
      regAuthority: taxOffice(rnd, who.region),
      regPlace: who.addrReg,
      site: '',
      okved: rnd.pick(D.okved),
      registered,
    };
  }

  /** Юридическое лицо с реквизитами и единоличным исполнительным органом. */
  function organization(rnd, { today }) {
    const i = rnd.int(0, D.orgNames.first.length - 1);
    const name = `${D.orgNames.first[i]} ${rnd.pick(D.orgNames.second)}`;
    const opf = rnd.pick(D.opf);
    const office = address(rnd);
    const region = office.region;
    const registered = rnd.date(addYears(today, -20), addDays(today, -400));
    const inspection = pad(rnd.int(1, 50));
    const domain = `${D.orgNames.slug[i]}-${rnd.int(10, 99)}.example.com`;
    const okato = okatoOf(region.name) + rnd.digits(6) + '000';
    return {
      fullName: `${opf.full} "${name}"`, shortName: `${opf.short} "${name}"`, opf: opf.full,
      phone: phone(rnd), email: `${rnd.pick(D.logins)}@${domain}`, site: `https://${domain}`,
      ogrn: sums.makeOgrn('1' + yy(registered) + region.tax + rnd.digits(7)),
      inn: sums.makeInn10(region.tax + inspection + rnd.digits(5)),
      kpp: region.tax + inspection + '01001',
      okpo: sums.makeOkpo(rnd.digits(7)),
      okato, okatoReport: okato,
      bik: '',                                  // БИК есть только у кредитных организаций
      okved: rnd.pick(D.okved),
      regDate: fmt(registered),
      regAuthority: taxOffice(rnd, region),
      regPlace: office.text, addrLegal: office.text,
      addrPost: rnd.chance(0.8) ? office.text : address(rnd, region).text,
      ceo: { ...person(rnd, { today }), position: rnd.pick(D.positions), confirmDoc: 'Устав', pep: D.pep.none, pepKin: '' },
      registered,
    };
  }

  /** Статус ПДЛ: у большинства «не являюсь»; у родственника заполнена степень родства. */
  function pep(rnd) {
    const roll = rnd.next();
    if (roll < 0.9) return { status: D.pep.none, kin: '' };
    if (roll < 0.95) return { status: D.pep.self, kin: '' };
    return { status: D.pep.relative, kin: rnd.pick(D.pep.kin) };
  }

  /** Бенефициар: ФЛ и ИП — сами себе; у ЮЛ в части случаев отдельное физическое лицо. */
  function beneficiary(rnd, type, ctx) {
    if (type !== 'LEGL' || rnd.chance(0.4)) return { kind: D.beneficiary.self, owns25: 'Нет', controls: 'Нет', person: {} };
    return {
      kind: D.beneficiary.other, owns25: rnd.pick(['Да', 'Нет']), controls: rnd.pick(['Да', 'Нет']),
      status: rnd.pick(D.beneficiary.statuses), confirmDoc: rnd.pick(D.beneficiary.documents),
      person: person(rnd, ctx),
    };
  }

  /** Представитель: у ЮЛ есть всегда, у ФЛ и ИП — изредка. Без представителя — «NOAGENT». */
  function agent(rnd, type, reg, ctx) {
    if (type !== 'LEGL' && rnd.chance(0.85)) return { userType: 'NOAGENT', person: {}, authority: {} };
    const issued = addDays(reg.applied, -rnd.int(1, 300));
    return {
      userType: 'AGENT', agentId: uuid(rnd), regDate: fmt(reg.registered),
      person: person(rnd, ctx),
      authority: {
        docName: rnd.pick(D.authority), docNumber: String(rnd.int(1, 999)),
        issueDate: fmt(issued), validTo: fmt(addYears(issued, rnd.int(1, 3))),
      },
    };
  }

  /**
   * Клиент целиком — всё, что попадает в одну строку csv.
   * @param type  PRSN | BUSN | LEGL
   * @param ctx   { today: Date } — дата, относительно которой считаются возраст и сроки
   */
  function client(rnd, type, ctx) {
    const applied = rnd.date(addDays(ctx.today, -365), addDays(ctx.today, -5));
    const identified = addDays(applied, rnd.int(0, 3));
    const registered = addDays(identified, rnd.int(0, 2));
    const reg = { applied, registered, applyDate: fmt(applied), identDate: fmt(identified), regDate: fmt(registered) };
    const c = {
      type, id: uuid(rnd), reg,
      bank: bank(rnd, type),
      qual: { status: rnd.pick(D.investor) },
    };
    if (type === 'LEGL') c.org = organization(rnd, ctx);
    else {
      c.person = person(rnd, ctx, type === 'BUSN' ? 21 : 19);
      c.pep = pep(rnd);
      if (type === 'BUSN') { c.ip = entrepreneur(rnd, c.person, ctx); c.person.fullName = `ИП ${c.person.fullName}`; }
    }
    c.ben = beneficiary(rnd, type, ctx);
    c.agent = agent(rnd, type, reg, ctx);
    return c;
  }

  C.generator.entities = { address, passport, person, bank, entrepreneur, organization, pep, beneficiary, agent, client };
})(globalThis.Comita);
</script>

<script>/* src/generator/dirty.js */
/* «Грязные» данные: порча строки csv так, как это происходит в жизни.
   Включается настройкой генератора; нужна, чтобы проверить предупреждения конвертера.
   Каждое правило: { title, columns: /шаблон алиаса/, chance, spoil(значение, rnd) → новое значение }. */
(function (C) {
  'use strict';

  /** 40702810500000012345 → «4,0702810500E+19», как после пересохранения файла в Excel. */
  function excelNumber(value, rnd) {
    const mantissa = value.slice(1, rnd.int(3, 12)).replace(/0+$/, '');
    return `${value[0]}${mantissa ? ',' + mantissa : ''}E+${value.length - 1}`;
  }

  /** «г. Москва, ул. Ленина, д. 5, кв. 12» — адрес, набранный одной строкой, а не по полям формы. */
  function freeFormAddress(value) {
    const [, , , city, street, house, , , flat] = value.split(',').map(s => s.trim());
    return [city, `ул. ${street}`, `д. ${house}`, flat && `кв. ${flat}`].filter(Boolean).join(', ');
  }

  /** Адрес из 8 частей: без пустого «Района». */
  const withoutDistrict = value => value.replace(/^([^,]*,[^,]*), ,/, '$1,');

  const rules = [
    { title: 'счёт пересохранён в Excel',     columns: /^bank\.(account|corrAccount)$/,                  chance: 0.6,  spoil: excelNumber },
    { title: 'потеряны ведущие нули',         columns: /(^bank\.bik|\.inn|\.snils|^req\.okpo)$/,         chance: 0.6,  spoil: v => v.replace(/^0+/, '') },
    { title: 'адрес набран одной строкой',    columns: /\.addr(Reg|Live|Post|Legal)$/,                   chance: 0.1,  spoil: freeFormAddress },
    { title: 'адрес без части «Район»',       columns: /\.addr(Reg|Live|Post|Legal)$/,                   chance: 0.15, spoil: withoutDistrict },
  ];

  /** Портит значения строки { алиас: значение } на месте. */
  function spoil(row, rnd) {
    for (const [alias, value] of Object.entries(row)) {
      if (!value) continue;
      const rule = rules.find(r => r.columns.test(alias) && rnd.chance(r.chance));
      if (rule) row[alias] = rule.spoil(value, rnd);
    }
  }

  C.generator.dirty = { rules, spoil };
})(globalThis.Comita);
</script>

<script>/* src/services/schema.js */
/* Схема «Карточка клиента»: модель XSD и проверка XML по ней.
   Текст схемы лежит в schemas/clientinfo.xsd.js (его генерирует build.js из CLIENTINFO_merged.xsd). */
(function (C) {
  'use strict';
  const { xml, xsdModel, xsdValidate } = C.core;

  let model = null;
  /** Модель схемы (строится один раз). */
  function getModel() {
    if (!model) {
      if (!C.schemas.clientinfo) throw new Error('Схема не загружена: нет schemas/clientinfo.xsd.js (запустите node build.js)');
      model = xsdModel.build(C.schemas.clientinfo);
    }
    return model;
  }

  /**
   * Проверка XML-текста по схеме.
   * @returns {{ ok: boolean, errors: [{ path, line, message }] }}
   */
  function validate(xmlText) {
    let root;
    try { root = xml.parse(xmlText); }
    catch (e) { return { ok: false, errors: [{ path: '', line: 0, message: e.message }] }; }
    const errors = xsdValidate.validate(root, getModel());
    return { ok: errors.length === 0, errors };
  }

  C.services.schema = { getModel, validate };
})(globalThis.Comita);
</script>
<script>/* src/services/load.js */
/* Загрузка входных данных: текст csv → тип пользователя и строки { алиас колонки: значение }. */
(function (C) {
  'use strict';
  const { csv } = C.core;
  const inputs = C.model.input.byType;

  const same = (a, b) => String(a ?? '').trim() === String(b ?? '').trim();

  /** Определяет входную структуру по строке заголовков: та, у которой совпало больше заголовков. */
  function detect(header) {
    const scored = Object.values(inputs).map(def => ({
      def,
      matched: def.columns.filter(c => same(header[c.index], c.header)).length,
    })).sort((a, b) => b.matched / b.def.columns.length - a.matched / a.def.columns.length);
    return scored[0].matched / scored[0].def.columns.length >= 0.8 ? scored[0].def : null;
  }

  /**
   * @returns {{ type, input, rows: [{ $line, алиас: значение }], issues: [{ level, line, message }] }}
   * type === null, если формат файла не распознан (тогда rows пуст).
   */
  function load(text, fileName = '') {
    const issues = [];
    const table = csv.parse(text);
    const where = fileName ? `${fileName}: ` : '';
    if (!table.length) return { type: null, input: null, rows: [], issues: [{ level: 'error', line: 0, message: `${where}файл пуст` }] };

    const [header, ...lines] = table;
    const input = detect(header);
    if (!input) {
      return { type: null, input: null, rows: [], issues: [{ level: 'error', line: 1, message: `${where}заголовок не соответствует ни одному формату выгрузки (PRSN, BUSN, LEGL)` }] };
    }
    for (const c of input.columns) {
      if (!same(header[c.index], c.header)) {
        issues.push({ level: 'error', line: 1, message: `${where}колонка ${c.index + 1}: ожидался заголовок «${c.header.trim()}», получен «${header[c.index] ?? ''}»` });
      }
    }
    if (header.length > input.columns.length) {
      issues.push({ level: 'warn', line: 1, message: `${where}лишние колонки (${header.length - input.columns.length}) после колонки ${input.columns.length} не используются` });
    }

    const typeColumn = input.columns.find(c => c.alias === 'main.userType');
    const rows = [];
    lines.forEach((cells, i) => {
      const line = i + 2;
      if (cells.every(v => v.trim() === '')) return;
      if (cells.length < input.columns.length) {
        issues.push({ level: 'error', line, message: `${where}строка ${line}: ${cells.length} колонок вместо ${input.columns.length}, строка пропущена` });
        return;
      }
      if (!same(cells[typeColumn.index], input.type)) {
        issues.push({ level: 'error', line, message: `${where}строка ${line}: тип пользователя «${cells[typeColumn.index]}» не соответствует формату файла ${input.type}, строка пропущена` });
        return;
      }
      const row = { $line: line };
      for (const c of input.columns) if (!c.marker) row[c.alias] = cells[c.index].trim();
      rows.push(row);
    });
    return { type: input.type, input, rows, issues };
  }

  C.services.load = { load };
})(globalThis.Comita);
</script>
<script>/* src/services/convert.js */
/* Конвертация: строка csv → XML «Карточка клиента» (один клиент — один XML) + проверка по XSD. */
(function (C) {
  'use strict';
  const { xml } = C.core;
  const { engine, builder } = C.mapping;
  const { schema } = C.services;

  const specs = {};
  /** Собирает и проверяет спецификацию маппинга для типа клиента (один раз). */
  function specFor(type) {
    if (specs[type]) return specs[type];
    const input = C.model.input.byType[type], rules = C.mapping[type];
    if (!input || !rules) throw new Error(`Нет входной структуры или маппинга для типа «${type}»`);
    const model = schema.getModel();
    const pathOf = C.model.output.clientinfo.resolve(model);
    for (const r of [...rules, ...C.mapping.defaults]) {
      pathOf(r.target);                                                  // алиас выходного поля существует
      const aliases = !r.source ? [] : r.source.kind === 'src' ? r.source.aliases
        : r.source.kind === 'parts' ? r.source.list.flatMap(([, a]) => a) : [];
      for (const a of aliases) {
        if (!input.aliases.has(a)) throw new Error(`Маппинг ${type}: во входной структуре нет колонки «${a}»`);
      }
    }
    return (specs[type] = { type, input, rules, defaults: C.mapping.defaults, model, pathOf });
  }

  /**
   * @param row      строка из services.load
   * @param type     PRSN | BUSN | LEGL
   * @param options  { employee: { lastName, firstName, middleName, position } }
   * @returns {{ id, type, line, fileName, xml, view, issues, xsd: { ok, errors }, ok }}
   *   issues — замечания маппинга [{ level: 'warn'|'error', field, message }]
   *   ok     — XML прошёл XSD и нет ошибок входных данных
   */
  function convert(row, type, options = {}) {
    const spec = specFor(type);
    const { values, issues } = engine.apply(row, spec, options);
    const { tree, view } = builder.build(values, spec.model);
    const text = xml.serialize(tree);
    const xsd = schema.validate(text);
    const id = row['main.userId'] || `строка-${row.$line}`;
    return {
      id, type, line: row.$line,
      title: type === 'LEGL' ? row['main.shortName'] || row['main.fullName'] : [row['main.lastName'], row['main.firstName'], row['main.middleName']].filter(Boolean).join(' '),
      fileName: `${type}_${id.replace(/[^\w.-]+/g, '_')}.xml`,
      xml: text, view, issues, xsd,
      ok: xsd.ok && !issues.some(i => i.level === 'error'),
    };
  }

  /** Конвертирует все строки загруженного файла. */
  const convertAll = (loaded, options) => loaded.rows.map(row => convert(row, loaded.type, options));

  C.services.convert = { convert, convertAll, specFor };
})(globalThis.Comita);
</script>
<script>/* src/services/export.js */
/* Выгрузка результатов конвертации: содержимое файлов (без работы с DOM). */
(function (C) {
  'use strict';
  const { zip, csv } = C.core;

  /** ZIP со всеми XML и отчётом. @returns {Uint8Array} */
  function archive(results) {
    return zip.build([
      ...results.map(r => ({ name: r.fileName, text: r.xml })),
      { name: 'отчёт.csv', text: report(results) },
    ]);
  }

  /** Отчёт csv: по строке на каждое замечание и на каждого клиента без замечаний. */
  function report(results) {
    const rows = [['Файл XML', 'Тип', 'Идентификатор', 'Клиент', 'Проверка XSD', 'Вид замечания', 'Поле', 'Замечание']];
    for (const r of results) {
      const head = [r.fileName, r.type, r.id, r.title, r.xsd.ok ? 'пройдена' : 'не пройдена'];
      const notes = [
        ...r.xsd.errors.map(e => ['ошибка XSD', e.path, e.message]),
        ...r.issues.map(i => [i.level === 'error' ? 'ошибка данных' : 'предупреждение', i.field, i.message]),
      ];
      if (!notes.length) rows.push([...head, '', '', '']);
      for (const n of notes) rows.push([...head, ...n]);
    }
    return csv.stringify(rows);
  }

  C.services.exporter = { archive, report };
})(globalThis.Comita);
</script>
<script>/* src/services/generate.js */
/* Генерация тестового csv: клиенты (generator/entities.js) → строки по описанию колонок (generator/*.gen.js). */
(function (C) {
  'use strict';
  const { csv, random } = C.core;
  const G = C.generator;

  /** Имена файлов выгрузки системы-источника. */
  const FILE_NAMES = {
    PRSN: 'prsn_registered_users_profile_info.csv',
    BUSN: 'busn_registered_users_profile_info.csv',
    LEGL: 'legal_registered_users_profile_info.csv',
  };

  const get = (object, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), object);

  const plans = {};
  /** Сверяет описание генерации со входной структурой (один раз для типа). */
  function planFor(type) {
    if (plans[type]) return plans[type];
    const input = C.model.input.byType[type], rules = G[type];
    if (!input || !rules) throw new Error(`Нет входной структуры или описания генерации для типа «${type}»`);
    const seen = new Set();
    for (const r of rules) {
      if (!input.aliases.has(r.column)) throw new Error(`Генерация ${type}: во входной структуре нет колонки «${r.column}»`);
      if (seen.has(r.column)) throw new Error(`Генерация ${type}: колонка «${r.column}» описана дважды`);
      seen.add(r.column);
    }
    return (plans[type] = { input, rules });
  }

  /**
   * @param type   PRSN | BUSN | LEGL
   * @param count  число строк (клиентов)
   * @param seed   зерно: одинаковые зерно и дата → одинаковый файл
   * @param dirty  добавить «грязные» значения (generator/dirty.js)
   * @param today  дата, от которой считаются возраст и сроки (по умолчанию — сегодня)
   * @returns {{ fileName, text, count }}
   */
  function generate({ type, count = 10, seed = 1, dirty = false, today = new Date() }) {
    const { input, rules } = planFor(type);
    const rnd = random.create(seed);
    const day = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
    const table = [input.columns.map(c => c.header)];
    for (let i = 0; i < count; i++) {
      const client = G.entities.client(rnd, type, { today: day });
      const row = Object.fromEntries(rules.map(r => [r.column, get(client, r.from) ?? '']));
      if (dirty) G.dirty.spoil(row, rnd);
      table.push(input.columns.map(c => (c.marker ? '' : row[c.alias] ?? '')));
    }
    return { fileName: FILE_NAMES[type], text: csv.stringify(table), count };
  }

  C.services.generate = { generate, FILE_NAMES };
})(globalThis.Comita);
</script>

<script>/* src/ui/dom.js */
/* Мелкие помощники для работы с DOM. Только здесь и в остальных файлах ui/ есть обращения к document. */
(function (C) {
  'use strict';

  /**
   * Создаёт элемент: h('button', { class: 'primary', onclick: fn }, 'Текст', дочерний элемент, …).
   * Свойства on* — обработчики событий; false, null и undefined среди атрибутов и детей пропускаются.
   */
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key === 'class') el.className = value;
      else if (key in el && key !== 'list') el[key] = value;
      else el.setAttribute(key, value === true ? '' : value);
    }
    el.append(...children.flat(Infinity).filter(c => c != null && c !== false));
    return el;
  }

  /** Заменяет содержимое элемента. */
  function fill(el, ...children) {
    el.replaceChildren(...children.flat(Infinity).filter(c => c != null && c !== false));
    return el;
  }

  /** Отдаёт пользователю файл: content — строка или Uint8Array. */
  function download(fileName, content, mime = 'application/octet-stream') {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = h('a', { href: url, download: fileName });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /** Читает файл как текст UTF-8. */
  const readText = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file, 'utf-8');
  });

  /** Небольшое хранилище настроек; если localStorage недоступен, настройки живут до закрытия страницы. */
  const settings = {
    load(key, fallback) {
      try { return { ...fallback, ...JSON.parse(localStorage.getItem(key) || '{}') }; } catch (e) { return { ...fallback }; }
    },
    save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* хранилище недоступно */ }
    },
  };

  C.ui.dom = { h, fill, download, readText, settings };
})(globalThis.Comita);
</script>
<script>/* src/ui/structure.view.js */
/* Экран «Структура»: всё дерево схемы со значениями клиента.
   Показывает каждый элемент XSD (в том числе пустой), его значение и откуда оно взято. */
(function (C) {
  'use strict';
  const { h } = C.ui.dom;

  /** Подпись источника значения. */
  function origin(entry) {
    if (!entry) return null;
    if (entry.rejected !== undefined && entry.value === undefined) {
      return h('span', { class: 'chip bad', title: 'Значение не проходит по схеме и в XML не выведено' }, `не выведено: «${entry.rejected}»`);
    }
    switch (entry.origin) {
      case 'csv':      return h('span', { class: 'chip csv', title: entry.source ? `колонка ${entry.source}` : '' }, `csv: ${entry.sourceLabel}`);
      case 'rule':     return h('span', { class: 'chip rule' }, 'правило системы');
      case 'settings': return h('span', { class: 'chip settings' }, 'настройки');
      case 'default':  return h('span', { class: 'chip default', title: entry.note }, 'по умолчанию');
      default:         return null;
    }
  }

  const title = node => [
    h('span', { class: 'el-name' }, node.name),
    h('span', { class: 'el-card', title: 'кратность по схеме' }, node.card),
    node.doc && h('span', { class: 'el-doc', title: node.doc }, node.doc),
  ];

  function leaf(node) {
    return h('div', { class: 'leaf' + (node.emitted ? '' : ' empty') },
      h('div', { class: 'el-title' }, title(node)),
      h('div', { class: 'el-value' }, node.value || h('span', { class: 'muted' }, '—')),
      h('div', { class: 'el-origin' }, origin(node.entry)),
      h('div', { class: 'el-type muted' }, node.type));
  }

  function group(node, hideEmpty) {
    const children = node.children.map(c => render(c, hideEmpty)).filter(Boolean);
    return h('details', { class: 'group' + (node.emitted ? '' : ' empty'), open: node.emitted },
      h('summary', { class: 'el-title' }, title(node)),
      h('div', { class: 'group-body' }, children));
  }

  /** @param node узел просмотра из mapping/builder.js; hideEmpty — не показывать элементы, которых нет в XML */
  function render(node, hideEmpty = false) {
    if (hideEmpty && !node.emitted) return null;
    return node.leaf ? leaf(node) : group(node, hideEmpty);
  }

  C.ui.structureView = { render };
})(globalThis.Comita);
</script>
<script>/* src/ui/generator.view.js */
/* Вкладка «Генератор»: параметры → csv. Файл можно скачать или сразу открыть в конвертере. */
(function (C) {
  'use strict';
  const { h, fill, download } = C.ui.dom;
  const { generate } = C.services.generate;
  const inputs = C.model.input.byType;
  const PREVIEW_ROWS = 20;

  /** @param onOpen  функция ([{ name, text }]) — открыть сгенерированные файлы в конвертере */
  function create({ onOpen }) {
    const type = h('select', {}, Object.values(inputs).map(i => h('option', { value: i.type }, `${i.type} — ${i.title}`)));
    const count = h('input', { type: 'number', min: 1, max: 100000, value: 10 });
    const seed = h('input', { type: 'number', min: 0, value: 1 });
    const dirty = h('input', { type: 'checkbox' });
    const preview = h('div', { class: 'preview' });

    const make = () => generate({
      type: type.value,
      count: Math.max(1, Math.floor(Number(count.value)) || 1),
      seed: Number(seed.value) || 0,

    });

    function show(file) {
      const table = C.core.csv.parse(file.text);
      const [header, ...rows] = table;

        h('p', { class: 'muted' }, `${file.fileName}: строк — ${file.count}, колонок — ${header.length}.`

            h('thead', {}, h('tr', {}, header.map(c => h('th', {}, c)))),
            h('tbody', {}, rows.slice(0, PREVIEW_ROWS).map(r => h('tr', {}, r.map(c => h('td', {}, c))))))));
    }

    const root = h('section', { class: 'tab-body' },

        h('label', { class: 'check', title: 'Счета в формате Excel (4,07E+19), потерянные ведущие нули, адреса одной строкой' }, dirty, 'добавить «грязные» данные'),
        h('div', { class: 'actions' },

          h('button', { onclick: () => { const f = make(); show(f); onOpen([{ name: f.fileName, text: f.text }]); } }, 'Открыть в конвертере'))),
      h('p', { class: 'muted note' },
        'Файл повторяет выгрузку системы: UTF-8 с BOM, разделитель «;», те же заголовки и порядок колонок. ',
        'ИНН, ОГРН, ОГРНИП, СНИЛС, ОКПО и расчётные счета — с верными контрольными суммами; паспорт, адрес и даты согласованы между собой.'),
      preview);

    return { root };
  }

  C.ui.generatorView = { create };
})(globalThis.Comita);

<script>/* src/ui/converter.view.js */
/* Вкладка «Конвертер»: csv → список клиентов → структура, XML и замечания по каждому.
   Вся работа с данными — в services/*; здесь только состояние экрана и отрисовка. */
(function (C) {
  'use strict';
  const { h, fill, download, readText, settings } = C.ui.dom;
  const { load } = C.services.load;
  const { convertAll } = C.services.convert;
  const exporter = C.services.exporter;

  const LIST_LIMIT = 500;
  const SETTINGS_KEY = 'comita.employee';
  const EMPLOYEE_FIELDS = [
    ['lastName', 'Фамилия'], ['firstName', 'Имя'], ['middleName', 'Отчество'], ['position', 'Должность'],
  ];
  const FILTERS = [
    ['all', 'все', () => true],
    ['bad', 'с ошибками', r => !r.ok],
    ['warn', 'с предупреждениями', r => r.issues.some(i => i.level === 'warn')],
  ];

  const warnings = r => r.issues.filter(i => i.level === 'warn').length;
  const errors = r => r.xsd.errors.length + r.issues.filter(i => i.level === 'error').length;

  /** XML с простой подсветкой: комментарии и теги. */
  function highlight(xml) {
    const pre = h('pre', { class: 'xml' });
    for (const part of xml.split(/(<!--[\s\S]*?-->|<[^>]+>)/)) {
      if (!part) continue;
      const kind = part.startsWith('<!--') ? 'x-comment' : part.startsWith('<') ? 'x-tag' : '';
      pre.append(kind ? h('span', { class: kind }, part) : part);
    }
    return pre;
  }

  function create() {
    const state = {
      files: [],            // [{ name, text }] — загруженные csv, чтобы пересчитать при смене настроек
      loadIssues: [],       // замечания к файлам целиком
      results: [],          // результаты services.convert
      selected: null,       // выбранный результат
      filter: 'all',
      tab: 'structure',
      hideEmpty: false,
      employee: settings.load(SETTINGS_KEY, { lastName: '', firstName: '', middleName: '', position: '' }),
    };

    const summary = h('div', { class: 'summary' });
    const list = h('div', { class: 'client-list' });
    const detail = h('div', { class: 'detail' });
    const fileIssues = h('div', {});
    const picker = h('input', { type: 'file', accept: '.csv,text/csv', multiple: true, hidden: true,
      onchange: e => { openFiles([...e.target.files]); e.target.value = ''; } });

    // ---------- данные ----------
    function recalculate() {
      state.loadIssues = [];
      state.results = [];
      for (const f of state.files) {
        const loaded = load(f.text, f.name);
        state.loadIssues.push(...loaded.issues);
        if (loaded.type) state.results.push(...convertAll(loaded, { employee: state.employee }));
      }
      const keep = state.selected && state.results.find(r => r.id === state.selected.id && r.type === state.selected.type);
      state.selected = keep || state.results[0] || null;
      render();
    }

    /** Открывает csv: массив File или готовых { name, text }. */
    async function openFiles(files) {
      state.files = await Promise.all(files.map(async f => (f.text && typeof f.text === 'string' ? f : { name: f.name, text: await readText(f) })));
      recalculate();
    }

    // ---------- отрисовка ----------
    function renderSummary() {
      const n = state.results.length;
      if (!state.files.length) return fill(summary);
      const ok = state.results.filter(r => r.ok).length;
      const withWarnings = state.results.filter(r => warnings(r)).length;
      fill(summary,
        h('span', {}, `Файлов: ${state.files.length}. Клиентов: ${n}.`),
        h('span', { class: ok === n ? 'good' : 'bad-text' }, `Прошли проверку: ${ok} из ${n}.`),
        h('span', { class: withWarnings ? 'warn-text' : '' }, `С предупреждениями: ${withWarnings}.`),
        h('span', { class: 'spacer' }),
        h('button', { disabled: !n, onclick: () => download('clientinfo_xml.zip', exporter.archive(state.results), 'application/zip') }, 'Скачать все XML (zip)'),
        h('button', { disabled: !n, onclick: () => download('отчёт.csv', exporter.report(state.results), 'text/csv;charset=utf-8') }, 'Отчёт (csv)'));
    }

    function renderFileIssues() {
      fill(fileIssues, state.loadIssues.length > 0 && h('div', { class: 'panel issues' },
        h('h3', {}, 'Замечания к файлам'),
        h('ul', {}, state.loadIssues.map(i => h('li', { class: i.level }, i.message)))));
    }

    function renderList() {
      const test = FILTERS.find(f => f[0] === state.filter)[2];
      const shown = state.results.filter(test);
      fill(list,
        h('div', { class: 'filters' }, FILTERS.map(([key, label, fn]) =>
          h('button', { class: 'pill' + (state.filter === key ? ' active' : ''), onclick: () => { state.filter = key; renderList(); } },
            `${label} ${state.results.filter(fn).length}`))),
        shown.slice(0, LIST_LIMIT).map(r => h('button', {
          class: 'client' + (r === state.selected ? ' active' : ''),
          onclick: () => { state.selected = r; renderList(); renderDetail(); },
        },
          h('span', { class: 'mark ' + (r.ok ? 'good' : 'bad-text'), title: r.ok ? 'XML прошёл проверку по XSD' : 'есть ошибки' }, r.ok ? '✓' : '✗'),
          h('span', { class: 'client-title' }, r.title || r.id, h('small', {}, `${r.type} · ${r.id}`)),
          warnings(r) > 0 && h('span', { class: 'badge', title: 'предупреждения' }, warnings(r)))),
        shown.length > LIST_LIMIT && h('p', { class: 'muted' }, `Показаны первые ${LIST_LIMIT} из ${shown.length}. В архив и отчёт попадают все.`),
        !shown.length && state.results.length > 0 && h('p', { class: 'muted' }, 'Нет клиентов с таким признаком.'));
    }

    function renderIssues(r) {
      const items = [
        ...r.xsd.errors.map(e => ({ level: 'error', label: 'XSD', text: `${e.message}${e.line ? ` (строка ${e.line} XML)` : ''}`, where: e.path })),
        ...r.issues.filter(i => i.level === 'error').map(i => ({ level: 'error', label: 'данные', text: i.message, where: i.field })),
        ...r.issues.filter(i => i.level === 'warn').map(i => ({ level: 'warn', label: 'предупреждение', text: i.message, where: i.field })),
      ];
      if (!items.length) return h('p', { class: 'good' }, 'XML соответствует XSD, замечаний нет.');
      return h('div', {},
        h('p', { class: r.xsd.ok ? 'good' : 'bad-text' }, r.xsd.ok ? 'XML соответствует XSD.' : `XML не соответствует XSD: ошибок — ${r.xsd.errors.length}.`),
        h('ul', { class: 'issue-list' }, items.map(i => h('li', { class: i.level },
          h('span', { class: 'chip ' + (i.level === 'error' ? 'bad' : 'default') }, i.label), ' ', i.text))));
    }

    function renderDetail() {
      const r = state.selected;
      if (!r) return fill(detail, state.files.length ? h('p', { class: 'muted' }, 'В файлах нет строк для конвертации.') : null);
      const tabs = [
        ['structure', 'Структура'],
        ['xml', 'XML'],
        ['issues', `Проверка${errors(r) + warnings(r) ? ` (${errors(r) + warnings(r)})` : ''}`],
      ];
      const body = state.tab === 'xml' ? highlight(r.xml)
        : state.tab === 'issues' ? renderIssues(r)
        : h('div', {},
            h('label', { class: 'check' },
              h('input', { type: 'checkbox', checked: state.hideEmpty, onchange: e => { state.hideEmpty = e.target.checked; renderDetail(); } }),
              'только то, что попало в XML'),
            h('div', { class: 'tree' }, C.ui.structureView.render(r.view, state.hideEmpty)));
      fill(detail,
        h('div', { class: 'detail-head' },
          h('h2', {}, r.title || r.id),
          h('span', { class: 'chip ' + (r.ok ? 'ok' : 'bad') }, r.ok ? 'проверка пройдена' : 'есть ошибки'),
          h('span', { class: 'muted' }, `строка ${r.line} csv`),
          h('span', { class: 'spacer' }),
          h('button', { onclick: () => download(r.fileName, r.xml, 'application/xml') }, 'Скачать XML')),
        h('div', { class: 'subtabs' }, tabs.map(([key, label]) =>
          h('button', { class: 'pill' + (state.tab === key ? ' active' : ''), onclick: () => { state.tab = key; renderDetail(); } }, label))),
        body);
    }

    function render() { renderSummary(); renderFileIssues(); renderList(); renderDetail(); }

    // ---------- настройки: сотрудник, заполнивший карточку ----------
    const employeeForm = h('details', { class: 'panel' },
      h('summary', {}, 'Сотрудник, заполнивший карточку (в csv его нет)'),
      h('div', { class: 'form' }, EMPLOYEE_FIELDS.map(([key, label]) =>
        h('label', {}, label, h('input', { type: 'text', value: state.employee[key], onchange: e => {
          state.employee[key] = e.target.value.trim();
          settings.save(SETTINGS_KEY, state.employee);
          if (state.files.length) recalculate();
        } })))));

    const drop = h('div', { class: 'drop',
      ondragover: e => { e.preventDefault(); drop.classList.add('over'); },
      ondragleave: () => drop.classList.remove('over'),
      ondrop: e => { e.preventDefault(); drop.classList.remove('over'); openFiles([...e.dataTransfer.files]); },
    },
      h('button', { class: 'primary', onclick: () => picker.click() }, 'Выбрать csv'),
      h('span', { class: 'muted' }, 'или перетащите сюда файлы выгрузки PRSN, BUSN, LEGL — можно несколько сразу'),
      picker);

    const root = h('section', { class: 'tab-body' },
      drop, employeeForm, summary, fileIssues,
      h('div', { class: 'split' }, list, detail));

    return { root, openFiles };
  }

  C.ui.converterView = { create };
})(globalThis.Comita);
</script>
<script>/* src/ui/app.js */
/* Точка входа интерфейса: вкладки и связь между ними. */
(function (C) {
  'use strict';
  const { h } = C.ui.dom;

  function start() {
    const converter = C.ui.converterView.create();
    const generator = C.ui.generatorView.create({
      onOpen: files => { converter.openFiles(files); select('converter'); },
    });
    const tabs = [
      { key: 'generator', title: 'Генератор csv', view: generator },
      { key: 'converter', title: 'Конвертер csv → XML', view: converter },
    ];

    const buttons = tabs.map(t => h('button', { class: 'tab', onclick: () => select(t.key) }, t.title));
    function select(key) {
      tabs.forEach((t, i) => {
        t.view.root.hidden = t.key !== key;
        buttons[i].classList.toggle('active', t.key === key);
      });
    }

    document.body.append(
      h('header', { class: 'top' }, h('h1', {}, 'Карточка клиента'), h('nav', {}, buttons)),
      h('main', {}, tabs.map(t => t.view.root)));
    select('converter');
  }

  try { start(); }
  catch (e) {
    document.body.append(h('pre', { class: 'fatal' }, `Приложение не запустилось: ${e.message}`));
    throw e;
  }
})(globalThis.Comita);
</script>
</body>
</html>
